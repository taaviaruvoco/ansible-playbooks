
---
- name: Apache või HTTP teenuse paigaldamine klientmasinas
  hosts: webservers
  vars:
    apache_deb: apache2
    apache_red: httpd
    user_name: user #kasutajanimi
    public_html_dir: "/home/{{ user_name }}/public_html" #puclic_html kausta asukoht kasutaja kodukaustas

  tasks:
####################Ülesanne1################################
    - name: Paigaldame apache2 teenuse Debian masinatele
      package:
        name: "{{ apache_deb }}"
        state: latest
        update_cache: yes
      when:
        - ansible_os_family == "Debian"

    - name: Paigaldame http teenuse RedHat masinatele
      package:
        name: "{{ apache_red }}"
        state: latest
        update_cache: yes
      when:
        - ansible_os_family == "RedHat"

    - name: Lubame apache2/http teenuse ja käivitame selle
      service:
        name: "{{ apache_deb if ansible_os_family == 'Debian' else apache_red }}"
        state: started
        enabled: yes

    - name: Avame HTTP pordi CentOS masina tulemüüris
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes
        zone: public
      when:
        - ansible_os_family == "RedHat"

####################Ülesanne2###############################

    - name: Loome public_html kausta kasutajale user
      file:
        path: "{{ public_html_dir }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: 0755
        state: directory

    - name: Anname kodukaustale vajalikud õigused
      file:
        path: "/home/{{ user_name }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0711'

####################Ülesanne3###############################

    - name: Lubame userdir mode'i Debiani masinal
      apache2_module:
        name: userdir
        state: present
      when:
        - ansible_os_family == "Debian"

#    - name: Muudame CentOSil es faili sisu
#      lineinfile:
#        path: /etc/httpd/conf.modules.d/00-base.conf
#        regexp: '^#LoadModule userdir_module'
#        line: 'LoadModule userdir_module modules/mod_userdir.so'
#        state: present
#      when: ansible_os_family == "RedHat"

    - name: Kommenteerime kinni UserDir disabled rea
      lineinfile:
        path: /etc/httpd/conf.d/userdir.conf
        regexp: '^\s*UserDir\s+disabled'
        line: "{{ '    ' }}{{ '#' }}{{ 'UserDir disabled' }}"
      when:
        - ansible_os_family == "RedHat"

    - name: Kommenteerime lahti UserDir public_html rea
      lineinfile:
        path: /etc/httpd/conf.d/userdir.conf
        regexp: '^\s*#UserDir\s+public_html'
        line: '    UserDir public_html'
      when:
        - ansible_os_family == "RedHat"

############################################################

    - name: Teeme apache2/http teenusele restardi
      service:
        name: "{{ apache_deb if ansible_os_family == 'Debian' else apache_red }}"
        state: restarted

####################Ülesanne5###############################

    - name: Kopeerime index.html faili kasutaja user public_html kausta
      copy:
        src: /var/www/html/index.html
        dest: "{{ public_html_dir }}"
        remote_src: yes
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0644'
      when:
        - ansible_os_family == "Debian"

    - name: Loome index.html faili public_html kausta
      copy:
        dest: "/home/{{ user_name }}/public_html/index.html"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Welcome to Apache on CentOS!</title>
          </head>
          <body>
            <h1>
              It works!
            </h1>
            <p>This is a test page in /home/{{ user_name }}/public_html.</p>
          </body>
          </html>
      when:
        - ansible_os_family == "RedHat"

    - name: Lubab Apache teenuse läbi SELinux turvakihi CentOS masinas
      command: setsebool -P httpd_enable_homedirs on
      when:
        -  ansible_os_family == "RedHat"

####################Ülesanne6###############################

    - name: Muuda rida index.html failis Debian masinas
      lineinfile:
        dest: "/home/{{ user_name }}/public_html/index.html"
        regexp: "Apache2 Debian Default Page"
        line: "{{ user_name}}-i lehekülg"
        state: present
      when:
        - ansible_os_family == "Debian"

    - name: Muuda rida index.html failis CentOS masinas
      lineinfile:
        dest: "/home/{{ user_name }}/public_html/index.html"
        regexp: "It works!"
        line: "{{ user_name}}-i lehekülg"
        state: present
      when:
        - ansible_os_family == "RedHat"

####################Iseseisev osa###########################

    - name: Loo unikaalne index.html fail kasutaja kodukausta
      copy:
        dest: "/home/{{ user_name }}/public_html/index.html"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Apache UserDir Test Page</title>
          </head>
          <body>
            <h1>Tere tulemast Apache UserDir kataloogi!</h1>

            <p><strong>Hostname:</strong> {{ ansible_hostname }}</p>
            <p><strong>IP-aadress:</strong> {{ ansible_default_ipv4.address }}</p>
            <p><strong>OS:</strong> {{ ansible_distribution }} {{ ansible_distribution_version }}</p>

            <p>See leht on loodud Ansible playbooki abil.</p>
          </body>
          </html>

############################################################

    - name: Teeme apache2/http teenusele restardi
      service:
        name: "{{ apache_deb if ansible_os_family == 'Debian' else apache_red }}"
        state: restarted

